[project]
name = "coppaddresd-ai-service"
version = "0.1.0"
description = "Servicio de agente IA escalable para CoppAddresd (LangGraph + FastAPI, multi-proveedor)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
    "numpy>=2.0",
    "psycopg[binary]>=3.2",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pypdf>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # B008: Depends() en defaults es patrón estándar de FastAPI

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501", "W291"]  # migraciones autogeneradas por Alembic
"scripts/*.py" = ["RUF100", "E501", "I001", "F401", "F541"]  # scripts de seed/dev, no código del servicio

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
