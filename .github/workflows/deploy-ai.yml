name: Deploy AI Service

on:
  push:
    branches: [dev]
    paths:
      - "**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-ai-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: 933629770820.dkr.ecr.us-east-2.amazonaws.com
  ECR_REPOSITORY: cooppadresd-ai
  ECS_CLUSTER: cooppadresd-cluster
  ECS_SERVICE: cooppadresd-ai

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Mismas credenciales que DATABASE_URL del step de tests (abajo):
        # el servicio existe para que los tests corran con la ruta Postgres
        # real (motor a nivel módulo + sesiones bajo TestClient). Auto-migrate
        # (default true) aplica las migraciones de Alembic al arrancar la app.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Habilitar pgvector en la DB de tests
        # La imagen del servicio trae la extensión instalada, pero cada DB
        # nueva debe habilitarla (CREATE EXTENSION) antes de las migraciones.
        run: psql "postgresql://test:test@localhost:5432/test" -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - name: Instalar dependencias de test
        run: |
          pip install --upgrade pip
          pip install -r requirements-prod.txt pytest pytest-asyncio httpx ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
          ENVIRONMENT: test
          INTERNAL_API_KEY: ci-test-key
          # Claves dummy: los tests no llaman al LLM (usan fakes), pero la
          # construcción del cliente del proveedor sí exige una key presente;
          # sin ellas las rutas devuelven 503 antes de validar el request.
          ANTHROPIC_API_KEY: ci-dummy-key
          OPENAI_API_KEY: ci-dummy-key

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::933629770820:role/cooppadresd-gha-ai
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      # Mismo camino de exportación que el backend: imagen local de una sola
      # plataforma y push clásico con el rol OIDC existente. Ubuntu-latest pasó
      # a Ubuntu26 y el build directo añadió un índice/attestation cuyo HEAD
      # recibió 403 en ECR antes de registrar una task definition (42911935083).
      - name: Build imagen (${{ github.sha }})
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Verificar imagen local antes de publicar
        shell: bash
        run: |
          IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          PLATFORM=$(docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}')
          if [ "$PLATFORM" != "linux/amd64" ]; then
            echo "::error::La imagen local no corresponde a linux/amd64"
            exit 1
          fi
          docker info --format 'Docker store: {{.Driver}} {{json .DriverStatus}}'

      - name: Push ECR
        run: |
          docker push "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          docker push "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest"

      - name: Registrar nueva Task Definition (imagen SHA)
        id: taskdef
        shell: bash
        run: |
          TASK_DEF_JSON=$(aws ecs describe-task-definition --task-definition "${{ env.ECS_SERVICE }}" --region "${{ env.AWS_REGION }}" --query "taskDefinition" --output json)
          NEW_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          # BACKEND_BASE_URL: ALB interno de la VPC para tools del AI Service
          # (get_patient_data → /api/v1/internal/agents/patient-context con
          # X-Internal-Key). Declarativo e idempotente (reemplaza si existe).
          NEW_TASK_DEF_JSON=$(echo "$TASK_DEF_JSON" | jq --arg img "$NEW_IMAGE" '
            .containerDefinitions[0].image = $img |
              .containerDefinitions[0].environment = ([
              .containerDefinitions[0].environment[]?
              | select(.name != "BACKEND_BASE_URL" and .name != "VITA_RUNTIME_ENABLED" and .name != "VITA_TRANSCRIPT_SYNC_ENABLED" and .name != "VITA_ELEVENLABS_AGENT_ID" and .name != "VITA_ELEVENLABS_VERSION_ID" and .name != "VITA_VOICE_ENABLED")
            ] + [
              {"name": "BACKEND_BASE_URL", "value": "http://internal-cooppadresd-alb-internal-1395345436.us-east-2.elb.amazonaws.com"},
              {"name": "VITA_RUNTIME_ENABLED", "value": "true"},
              {"name": "VITA_TRANSCRIPT_SYNC_ENABLED", "value": "true"},
              {"name": "VITA_ELEVENLABS_AGENT_ID", "value": "agent_5501m7dgvbpff26b1nk5s73qx4kf"},
              {"name": "VITA_ELEVENLABS_VERSION_ID", "value": "agtvrsn_8001m7dgvcp9fmftcphr1cky9pwe"},
              {"name": "VITA_VOICE_ENABLED", "value": "false"}
            ]) |
              .containerDefinitions[0].secrets = ([
              .containerDefinitions[0].secrets[]?
              | select(.name != "VITA_VOICE_SERVICE_KEY" and .name != "VITA_VOICE_CONTEXT_SECRET")
            ] + [
              {"name": "VITA_VOICE_SERVICE_KEY", "valueFrom": "arn:aws:secretsmanager:us-east-2:933629770820:secret:cooppadresd/ai-vita-runtime-wO0tKF:voice_service_key::"},
              {"name": "VITA_VOICE_CONTEXT_SECRET", "valueFrom": "arn:aws:secretsmanager:us-east-2:933629770820:secret:cooppadresd/ai-vita-runtime-wO0tKF:voice_context_secret::"}
            ]) |
            del(.status, .compatibilities, .taskDefinitionArn, .revision, .registeredAt, .registeredBy, .requiresAttributes)
          ')
          REGISTERED=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF_JSON" --region "${{ env.AWS_REGION }}")
          echo "arn=$(echo "$REGISTERED" | jq -r '.taskDefinition.taskDefinitionArn')" >> "$GITHUB_OUTPUT"

      - name: Actualizar ECS Service
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Esperar rollout COMPLETED (polling 15s)
        timeout-minutes: 20
        shell: bash
        run: |
          SERVICE="${{ env.ECS_SERVICE }}"
          TD_ARN="${{ steps.taskdef.outputs.arn }}"
          DEADLINE=$((SECONDS + 1200))

          while true; do
            DEP=$(aws ecs describe-services \
              --cluster "${{ env.ECS_CLUSTER }}" \
              --services "$SERVICE" \
              --region "${{ env.AWS_REGION }}" \
              --query "services[0].deployments[?taskDefinition=='$TD_ARN'] | [0]" \
              --output json)

            STATE=$(echo "$DEP" | jq -r '.rolloutState // "MISSING"')
            RUNNING=$(echo "$DEP" | jq -r '.runningCount // "?"')
            DESIRED=$(echo "$DEP" | jq -r '.desiredCount // "?"')

            echo "[$(date -u +%H:%M:%S)] rollout=$STATE running=$RUNNING desired=$DESIRED"

            if [ "$STATE" = "COMPLETED" ] && [ "$RUNNING" = "$DESIRED" ]; then
              echo "Deployment estable: rollout=$STATE running=$RUNNING desired=$DESIRED"
              exit 0
            fi

            if [ "$STATE" = "FAILED" ]; then
              echo "::error::Rollout FAILED: el deployment de $SERVICE no pudo completarse"
              exit 1
            fi

            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::Timeout 20 min: rollout=$STATE running=$RUNNING desired=$DESIRED"
              exit 1
            fi

            sleep 15
          done

      - name: Diagnóstico en fallo
        if: failure()
        shell: bash
        run: |
          TASKS=$(aws ecs list-tasks \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service-name "${{ env.ECS_SERVICE }}" \
            --region "${{ env.AWS_REGION }}" --query "taskArns" --output text)
          for T in $TASKS; do
            aws ecs describe-tasks \
              --cluster "${{ env.ECS_CLUSTER }}" \
              --tasks "$T" --region "${{ env.AWS_REGION }}" \
              --query "tasks[0].{Status:lastStatus,Stop:stoppedReason,Containers:containers[*].{Name:name,Exit:exitCode,Reason:reason}}" \
              --output json
          done
          # re-register
