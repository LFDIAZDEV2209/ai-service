services:
  postgres:
    image: postgres:16-alpine
    container_name: coppai-postgres
    environment:
      POSTGRES_USER: coppai
      POSTGRES_PASSWORD: coppai
      POSTGRES_DB: coppai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coppai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
